[project]
name = "comparison"
version = "0.1.0"
description = "Benchmark 4 tabular foundation models against the pd-autopilot WoE-logit champion on German Credit."
requires-python = ">=3.12"
dependencies = [
    "carte-ai>=0.0.26",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optbinning>=0.21.0",
    "optuna>=4.8.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tabdpt>=1.1.14",
    "tabicl>=2.1.1",
    "tabpfn>=2.0,<7.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "slow: heavy TFM tests; opt in with -m slow",
]
# Without -m slow, ignore the TFM test files entirely. Pytest's default
# collection imports every test module to discover tests, which pulls torch
# (via tabpfn/tabicl/tabdpt/carte) into the same process as LightGBM. Torch
# bundles its own libomp; LightGBM uses Homebrew libomp; co-loading segfaults
# LGBMClassifier.fit() on macOS arm64. Skipping collection of slow-tagged
# files keeps the fast suite torch-free.
#
# Use:
#   uv run pytest                  → fast suite, no torch
#   uv run pytest -m slow          → opt-in: collects everything, runs slow
addopts = "--ignore=tests/test_tabpfn.py --ignore=tests/test_tabicl.py --ignore=tests/test_tabdpt.py --ignore=tests/test_carte.py"
